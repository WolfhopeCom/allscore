name: App Store screenshots

# Runs when a commit message contains [screenshots]. Captures the App Store set on the
# 6.9-inch iPhone and 13-inch iPad simulators and commits the PNGs to the `screenshots` branch.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Pick simulators
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if '$1' in x['name']]
          c.sort(key=lambda kx: [int(p) for p in kx[0].split('iOS-')[-1].split('-')])
          k,x=c[-1]; print(x['udid']); print(x['name'], k, file=sys.stderr)"
          }
          echo "IPHONE=$(pick 'Pro Max')" >> "$GITHUB_ENV"
          echo "IPAD=$(pick 'iPad Pro 13')" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AllSportsScoreboard.xcodeproj -scheme AllSportsScoreboard \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Capture
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/AllSportsScoreboard.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p shots
          capture() {
            DEVICE=$1; UDID=$2
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --batteryState charged \
              --cellularMode active --cellularBars 4 --wifiBars 3 --dataNetwork wifi
            xcrun simctl install "$UDID" "$APP"
            N=0
            for SCENE in basketball:scoreboard home:sports settings:settings bucketGolf:bucket-golf final:final; do
              N=$((N+1)); KEY=${SCENE%%:*}; NAME=${SCENE##*:}
              FILE="shots/$DEVICE-$N-$NAME.png"
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -screenshot "$KEY"
              sleep 10
              xcrun simctl io "$UDID" screenshot "$FILE"
              # simctl captures the portrait framebuffer; turn landscape scenes the right way up.
              case "$KEY" in home|settings) ;; *) sips -r 270 "$FILE" > /dev/null ;; esac
              sips -g pixelWidth -g pixelHeight "$FILE" | tail -2
            done
            xcrun simctl shutdown "$UDID" || true
          }
          capture iphone "$IPHONE"
          capture ipad "$IPAD"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots
          find ~/Library/Logs/DiagnosticReports -name "AllSportsScoreboard*" -newer build -exec cp {} shots/ \; 2>/dev/null || true
          ls shots

      - name: Commit to the screenshots branch
        run: |
          mkdir /tmp/out && cp shots/* /tmp/out/ && cd /tmp/out
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
