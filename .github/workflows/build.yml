name: Build and test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AllSportsScoreboard.xcodeproj -scheme AllSportsScoreboard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: List compile errors
        if: failure()
        run: python3 .github/annotate.py build.log 0
      - name: List more compile errors
        if: failure()
        run: python3 .github/annotate.py build.log 30

      - name: Test
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild -project AllSportsScoreboard.xcodeproj -scheme AllSportsScoreboard \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log
      - name: List test failures
        if: failure()
        run: python3 .github/annotate.py test.log 0
